*{box-sizing:border-box}

body{min-height:100%;color:var(--ink);font-family:var(--round);font-size:16px;font-weight:600;line-height:1.5;

}
.wrap{max-width:1300px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px 24px}

  more:'<div class="more"><h3>Що збагатило мій досвід</h3><p>Один день я читала анкети вчителів з усієї України. Одні описували гарні ідеї. Інші показували, <b>що змінилося для їхніх учнів</b>, і саме такі анкети запам’ятовувалися.</p><p class="stage">Як я працюю з чужим досвідом</p><p>У кожного вчителя свій досвід, тому одну й ту саму ідею кожен бачить по-своєму. Колеги діляться тим, що спрацювало в них, а я <b>беру те, що потрібно саме моїм учням</b>. Пробую на уроці. Якщо не виходить, змінюю. Так поступово народжується <span class="hl">мій власний підхід до навчання</span>.</p><ol class="cycle"><li>почула</li><li>осмислила</li><li>спробувала</li><li>змінила</li><li>мій підхід</li></ol><p class="stage">Як це виглядає на моїх уроках</p><ul><li><b>Формувальне оцінювання щодня.</b> Короткі перевірки на кожному уроці показують, хто де застряг, ще до контрольної. Діти <span class="hl">бачать свій прогрес одразу</span>, а не наприкінці семестру.</li><li><b>Коучингові запитання.</b> Замість готової відповіді питаю: «Що ти вже знаєш? З чого почнеш?» Учень сам шукає шлях, а я підказую лише тоді, коли він справді застряг.</li><li><b>Елементи гри.</b> Додаю в уроки ігрові завдання, щоб учням хотілося рухатися далі навіть у складній темі.</li><li><b>Кожен вчиться по-своєму.</b> Під час планування враховую, як працює увага й пам’ять дитини: комусь потрібна схема, комусь дослід, комусь пояснення вголос.</li></ul><p class="stage">Які компетентності вчителя я розвивала</p><ul class="comp"><li><b>Оцінювально-аналітична.</b> Оцінювала анкети за критеріями й училася бачити реальний результат за гарним описом.</li><li><b>Предметно-методична.</b> Добираю метод під мету уроку з фізики чи математики, а не навпаки.</li><li><b>Психологічна.</b> Через коучингові запитання підтримую самостійність учня і його віру у свої сили.</li><li><b>Інклюзивна.</b> Враховую, що діти мають різні потреби й темп навчання.</li><li><b>Інноваційна.</b> На онлайн-уроці постійно змінюю форми роботи, щоб діти не лише слухали вчителя, а <span class="hl">якнайбільше практикували</span>: вікторина в Kahoot, розв’язування на дошці, робота в групах, вправи, хмаринка слів, відповіді в чаті.</li><li><b>Інформаційно-цифрова.</b> Добираю цифрові інструменти так, щоб кожен учень міг надолужувати пропущене у своєму темпі.</li><li><b>Рефлексивна.</b> Аналізую свої уроки й змінюю те, що не спрацювало.</li></ul></div>',
